<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>MMPI 本地浏览器回归</title>
<pre id="result">RUNNING</pre>
<iframe id="app" title="测试页" style="width:1100px;height:800px"></iframe>
<script>
// 通过HTTP服务打开；自动检查真实页面、DOM和Chart.js，不发送答卷。
const frame = document.getElementById('app');
frame.onload = function () {
  const checks = [];
  function check(value, message) {
    if (!value) throw new Error(message);
    checks.push(message);
  }
  try {
    const w = frame.contentWindow, d = w.document;
    const text = () => d.getElementById('score-results').textContent;
    w.alert = function () {};
    check(typeof w.Chart === 'function', 'Chart.js 2.9.4 加载成功');
    const chartScript = [...d.scripts].find(script => /Chart-2\.9\.4\.min\.js$/.test(script.getAttribute('src') || ''));
    check(chartScript && chartScript.getAttribute('src') === './copy_files/Chart-2.9.4.min.js', 'Chart.js 使用仓库内本地文件');
    check(d.querySelectorAll('input[type=radio][name^=Q]').length === 1134, '567题渲染完整');
    const instruction = d.querySelector('.answer-instruction');
    check(instruction && instruction.textContent.includes('按整句话判断'), '作答说明明确否定句也按整句判断');
    const firstOptions = [...d.querySelectorAll('.answer-option')].slice(0, 2);
    const submitButton = d.querySelector('input.my_button[value="提交测试"]');
    check(firstOptions.length === 2 && firstOptions.map(el => el.textContent.trim()).join('/') === '符合/不符合' &&
      firstOptions.every(el => el.getBoundingClientRect().height >= 35 && el.getBoundingClientRect().width >= 58 &&
        getComputedStyle(el.querySelector('.answer-option__surface')).fontSize === getComputedStyle(submitButton).fontSize), '题目选项约58×35且字号与提交测试一致');
    const firstSurface = firstOptions[0].querySelector('.answer-option__surface');
    const firstInput = firstOptions[0].querySelector('input');
    firstSurface.style.transition = 'none';
    firstOptions[0].click();
    check(firstInput.checked && getComputedStyle(firstSurface).backgroundColor === 'rgb(176, 196, 222)', '点击选项块任意位置即可选中并显示灰蓝实底');
    firstInput.checked = false;
    w.score_rb(d.forms.questions);
    check(!text().includes('答卷检查：'), '空答不显示检查框');
    check(d.querySelector('#score-results table'), '空答仍显示分数表');
    const tables = () => [...d.querySelectorAll('#score-results table')];
    const basicTable = () => tables().find(t => t.rows[0]?.textContent.includes('中国常模近似 T 分'));
    const rawTable = () => tables().find(t => t.tHead?.textContent.includes('Scale Description'));
    const before = (a, b) => !!(a.compareDocumentPosition(b) & w.Node.DOCUMENT_POSITION_FOLLOWING);
    const chartInstances = () => Object.values(w.Chart.instances);
    const chartById = id => chartInstances().find(c => c.canvas.id === id);
    function checkChartValues(gender) {
      const groups = [
        ['myChart1', ['L','F','K','Hs','D','Hy','Pd','Mf','Pa','Pt','Sc','Ma','Si']],
        ['myChart2', ['ANX','FRS','OBS','DEP','HEA','BIZ','ANG','CYN','ASP','TPA','LSE','SOD','FAM','WRK','TRT']]
      ];
      groups.forEach(([id, keys]) => {
        const chart = chartById(id);
        if (!chart) return;
        check(chart.options.title.text.includes('中国常模近似 T 分') &&
          chart.data.datasets[0].label.includes('中国常模近似 T 分'), `${id} 标明近似中国 T 分`);
        check(chart.data.datasets[0].data.length === keys.length &&
          keys.every((key, i) => {
            const row = [...rawTable().tBodies[0].rows].find(r => r.cells[0].textContent.trim() === key);
            if (!row || chart.data.labels[i] !== key) return false;
            const us = Number(row.cells[4].textContent.trim());
            const expected = Number.isFinite(us) ? w.MMPI_CN.correctT(key, gender, us) : null;
            return chart.data.datasets[0].data[i] === expected;
          }), `${id} 各点与近似中国 T 分一致，缺失点为 null`);
      });
    }
    check(tables().length === 3 && basicTable(), '仅保留全量表大表、关键题表和一张近似中国基础表');
    check(basicTable().rows[0].cells[0].getBoundingClientRect().width /
      basicTable().getBoundingClientRect().width >= 0.2, '基础解释表左列至少占表宽的五分之一');
    check(basicTable().textContent.includes('基础解释') && !text().includes('美国常模 T 分（原始查表）'), '简明表头且无重复美国13项表');
    check(!text().includes('按本近似公式换算为60分'), '不在个人结果页显示技术对照表');
    const note = [...d.querySelectorAll('#score-results span')].find(el => el.textContent.startsWith('中国常模近似T分表按'));
    const link = [...d.querySelectorAll('#score-results a')].find(el => el.textContent.includes('查看常模换算'));
    const warning = [...d.querySelectorAll('#score-results span2')].find(el => el.textContent.includes('结果仅供参考'));
    const choices = [...d.querySelectorAll('#score-results span4')].find(el => el.textContent.startsWith('如果有需要，可以保留您的原始选项'));
    check(note && getComputedStyle(note).maxWidth === '1100px' && getComputedStyle(note).color === 'rgb(135, 206, 235)', '说明保留原文并限宽、改天空蓝');
    check(link && link.hostname === 'github.com' && decodeURIComponent(link.pathname).endsWith('/docs/探索纪要-TLDR.md') && getComputedStyle(link).color === 'rgb(135, 206, 235)', '说明文档提供天空蓝超链接');
    check(warning && getComputedStyle(warning).color === 'rgb(255, 0, 0)', '中间参考警告仍为红色');
    check(note && warning && link && basicTable() && rawTable() && choices &&
      before(note, warning) && before(warning, link) && before(link, basicTable()) &&
      before(basicTable(), rawTable()) && before(rawTable(), choices), '诊断说明和警告紧随诊断表，技术表在后，原始选项最后');
    check(choices && getComputedStyle(choices).maxWidth !== 'none' &&
      ['break-word','anywhere'].includes(getComputedStyle(choices).overflowWrap), '原始选项限制宽度并允许长答卷换行');
    check(Object.keys(w.Chart.instances).length === 2, '空答仍显示两张长卷图');
    checkChartValues(0);
    let seed = 20260922;
    w.Math.random = () => { seed = (Math.imul(seed,1664525)+1013904223) >>> 0; return seed / 4294967296; };
    w.clickRandomToTOrF('select_all');
    check(d.querySelectorAll('input[type=radio][name^=Q]:checked').length === 567, '随机填答无漏题');
    w.score_rb(d.forms.questions);
    check(!text().includes('答卷检查：') && basicTable().textContent.includes('基础解释') && !text().includes('以下解释按美国常模T分分档'), '随机答卷无检查框，保留作者原三档基础解释');
    check(Object.keys(w.Chart.instances).length === 2, '长卷保留两张真实图表');
    checkChartValues(0);
    const mfRows = () => rawTable().querySelectorAll('tbody tr');
    check([...mfRows()].filter(r => r.cells[0].textContent.trim() === 'Mf').length === 1, '男性原始表只显示一条Mf');
    check([...mfRows()].find(r => r.cells[0].textContent.trim() === 'Mf').textContent.includes('Male'), '男性Mf使用男表');
    check(basicTable().textContent.includes('Mf（按男性计分）'), '男性基础解释表使用男Mf');
    w.use_long_form(false);
    w.set_gender(1);
    w.clickAllToF('select_all');
    w.score_rb(d.forms.questions);
    check(w.ans.length === 371, '短卷只读取370题');
    check(text().includes('短卷不适用'), '短卷不报告内容量表部分分数');
    check(Object.keys(w.Chart.instances).length === 1, '重算销毁旧图，短卷只留一张');
    checkChartValues(1);
    check([...mfRows()].filter(r => r.cells[0].textContent.trim() === 'Mf').length === 1, '女性原始表只显示一条Mf');
    check([...mfRows()].find(r => r.cells[0].textContent.trim() === 'Mf').textContent.includes('Female'), '女性Mf使用女表');
    check(basicTable().textContent.includes('Mf（按女性计分）'), '女性基础解释表使用女Mf');
    check(d.querySelectorAll('#score-results').length === 1, '重复提交只保留本次报告');
    d.querySelectorAll('input[type=radio][name^=Q]').forEach(el => { el.checked = false; });
    w.score_rb(d.forms.questions);
    check(d.querySelector('#score-results table') && !text().includes('答卷检查：'), '重算空答显示本次分数且无检查框');
    check(Object.keys(w.Chart.instances).length === 1, '重算空答保留本次短卷图');
    document.getElementById('result').textContent = 'PASS ' + checks.length + '\n' + checks.join('\n');
  } catch (error) {
    document.getElementById('result').textContent = 'FAIL\n' + checks.join('\n') + '\n' + error.stack;
  }
};
frame.src = '../MMPI-1-test.html';
</script>
</html>
